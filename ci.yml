name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - run: mvn -B -q package
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            spark-jobs/target/spark-jobs.jar
            ingest-service/target/ingest-service.jar

  e2e:
    name: End-to-end pipeline on sample video
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: jars, path: . }
      - run: |
          mkdir -p spark-jobs/target ingest-service/target
          mv spark-jobs.jar spark-jobs/target/ 2>/dev/null || true
          mv ingest-service.jar ingest-service/target/ 2>/dev/null || true

      - name: Install ffmpeg + python deps
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -q ultralytics onnx

      - name: Build sample video and export YOLO model
        run: |
          chmod +x scripts/*.sh
          scripts/make-sample-video.sh
          scripts/get-model.sh

      - name: Bring up the stack
        run: |
          docker compose up -d --build
          docker compose ps

      - name: Wait for Airflow and Trino
        run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:8088/health && break; sleep 10; done
          for i in $(seq 1 30); do
            docker compose exec -T trino trino --execute "SELECT 1" && break; sleep 10; done

      - name: Bootstrap buckets, topic, tables
        run: scripts/bootstrap.sh

      - name: Trigger a run with the sample video
        run: scripts/trigger-sample.sh

      - name: Wait for DAG
        run: scripts/wait-for-dag.sh frameforge_video 900

      - name: Assertions over Trino
        run: scripts/ci-assert.sh

      - name: Negative test — gate must block corrupt data
        run: scripts/ci-gate-negative.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200 airflow ingest-service spark-master

      - name: Tear down
        if: always()
        run: docker compose down -v
